name: Recorder check

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Last good run within 2 hours, and it sealed what was waiting
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          body=$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "$API_URL/api/health")
          recorder=$(jq -c '.recorder' <<<"$body")
          echo "recorder: $recorder"
          last_ok_at=$(jq -r '.last_ok_at // empty' <<<"$recorder")
          if [ -z "$last_ok_at" ]; then
            echo "::error::The recorder has no good run on record"
            exit 1
          fi
          age=$(( $(date +%s) - $(date -d "$last_ok_at" +%s) ))
          if [ "$age" -gt 7200 ]; then
            echo "::error::The last good run finished $((age / 60)) minutes ago"
            exit 1
          fi
          # A run writes its row when it ends, so until this hour's run is in, the last row is an
          # earlier run's and can't be judged against the records this one is still sealing.
          last_run_at=$(jq -r '.last_run_at' <<<"$recorder")
          if [ "$(date -d "$last_run_at" +%s)" -ge "$(date -d "$(date -u +%Y-%m-%dT%H:00:00Z)" +%s)" ] &&
            jq -e '.last_sealed == 0 and .unsealed > 0' <<<"$recorder" >/dev/null; then
            echo "::error::The last run sealed nothing while $(jq .unsealed <<<"$recorder") records wait"
            exit 1
          fi
