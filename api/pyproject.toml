[project]
name = "firewatch"
version = "0.1.0"
description = "Fire Watch: record FIRMS hotspots, seal them on chain, serve them read-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "web3>=7,<8",
    "httpx",
]

[project.scripts]
record-hotspots = "firewatch.record_hotspots:main"
load-concessions = "firewatch.concessions:main"
backtest-2023 = "firewatch.backtest:main"
load-peat = "firewatch.peat:main"

[dependency-groups]
cut = [
    "rasterio>=1.5.2",
]
dev = [
    "pytest",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
