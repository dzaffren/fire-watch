[project]
name = "firewatch"
version = "0.1.0"
description = "Fire Watch: record FIRMS hotspots, seal them on chain, serve them read-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "web3>=7,<8",
    "httpx",
]

[project.scripts]
record-latest = "firewatch.record_latest:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
