<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status labels</title>
<link rel="stylesheet" href="../styles.css">
<style>
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pair > div { padding: 24px; background: var(--fw-bg); color: var(--fw-ink); display: grid; gap: 12px; align-content: start; }
.item { display: grid; gap: 4px; justify-items: start; }
</style>
</head>
<body>
<div class="pair">
<div data-theme="light">
<div class="fw-label">Light</div>
<div class="item"><span class="fw-chip fw-chip--ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Matches the chain</span><span class="fw-help">The stored record is what was sealed.</span></div>
<div class="item"><span class="fw-chip fw-chip--bad"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Does not match the chain</span><span class="fw-help">Something changed after sealing.</span></div>
<div class="item"><span class="fw-chip fw-chip--pending"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Not on chain yet</span><span class="fw-help">Stored, waiting to be sealed.</span></div>
<div class="item"><span class="fw-chip fw-chip--checking"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>Checking</span><span class="fw-help">Comparing with the chain now.</span></div>
<p class="fw-help">Matches and does-not-match are equally light, so each always carries its own icon and words.</p>
</div>
</div>
<script>
document.querySelectorAll('.pair > [data-theme="light"]').forEach(function (el) {
  var d = el.cloneNode(true); d.dataset.theme = "dark";
  d.querySelector(".fw-label").textContent = "Dark";
  el.parentNode.appendChild(d);
});
</script>
</body>
</html>
